<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crane Cam</title>
  <style>
    :root {
      --bg:     #0d0f12;
      --panel:  #13161b;
      --border: #1e2530;
      --accent: #00aaff;
      --ok:     #00cc66;
      --warn:   #ff6b00;
      --err:    #ff3333;
      --text:   #c8d4e0;
      --dim:    #5a6a7a;
      --btn:    #1a2030;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Top bar ─────────────────────────────────── */
    #topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 0 12px; height: 36px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; }
    .spacer { flex: 1; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
    .dot.ok   { background: var(--ok);  box-shadow: 0 0 5px var(--ok); }
    .dot.err  { background: var(--err); box-shadow: 0 0 5px var(--err); }
    .dot.warn { background: var(--warn);box-shadow: 0 0 5px var(--warn); }
    .pill { display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: monospace; }
    .pill .lbl { color: var(--dim); }
    #lat-ms { color: var(--ok); font-weight: 700; font-family: monospace; font-size: 11px; }
    #sidebar-toggle { background: none; border: 1px solid #2e3a4a; border-radius: 3px; color: var(--dim); cursor: pointer; font-size: 14px; padding: 2px 8px; }
    #sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Main ───────────────────────────────────── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Video ──────────────────────────────────── */
    #video-panel { flex: 1; position: relative; background: #000; overflow: hidden; cursor: crosshair; }
    #stream { width: 100%; height: 100%; object-fit: contain; display: block; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: #000c; color: var(--dim);
    }
    .spinner { width: 30px; height: 30px; border: 3px solid #2e3a4a; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay p { font-family: monospace; font-size: 12px; }

    /* ── Sidebar ────────────────────────────────── */
    #sidebar {
      width: 280px; flex-shrink: 0;
      background: var(--panel); border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: width 0.2s ease, opacity 0.2s ease;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; opacity: 0; }

    /* ── Tabs ───────────────────────────────────── */
    #tab-bar { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab-btn {
      flex: 1; background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--dim); cursor: pointer;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; padding: 9px 4px;
      text-transform: uppercase; transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-pane { display: none; flex: 1; overflow-y: auto; padding: 12px; }
    .tab-pane.active { display: block; }
    #tab-log.active { display: flex; flex-direction: column; }

    /* ── Shared form elements ───────────────────── */
    .sec {
      font-size: 9px; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--dim);
      margin: 14px 0 8px; padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .sec:first-child { margin-top: 0; }

    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .field label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .field input[type=text], .field select {
      background: var(--bg); border: 1px solid #2e3a4a; border-radius: 3px;
      color: var(--text); font-family: monospace; font-size: 11px;
      padding: 5px 7px; outline: none; width: 100%;
    }
    .field input[type=text]:focus, .field select:focus { border-color: var(--accent); }

    .btn-main {
      width: 100%; background: #00aaff22; border: 1px solid var(--accent);
      border-radius: 3px; color: var(--accent); cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      padding: 7px; margin-bottom: 4px;
    }
    .btn-main:hover { background: var(--accent); color: var(--bg); }

    .btn-preset {
      width: 100%; background: var(--btn); border: 1px solid #2e3a4a;
      border-radius: 3px; color: var(--text); cursor: pointer;
      font-size: 11px; padding: 7px 10px; text-align: left; margin-bottom: 5px;
    }
    .btn-preset:hover { border-color: var(--accent); }

    /* ── Slider row ─────────────────────────────── */
    .sl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
    .sl-row label { font-size: 10px; color: var(--dim); white-space: nowrap; min-width: 52px; }
    .sl-row input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .sl-val { font-family: monospace; font-size: 10px; color: var(--accent); width: 26px; text-align: right; flex-shrink: 0; }

    /* ── Toggle row ─────────────────────────────── */
    .tog-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .tog-row label { font-size: 10px; color: var(--dim); }
    .tog {
      background: var(--btn); border: 1px solid #2e3a4a;
      border-radius: 3px; color: var(--dim); cursor: pointer;
      font-size: 10px; font-weight: 700; font-family: monospace;
      padding: 3px 10px; min-width: 36px;
    }
    .tog.on { background: #00aaff22; border-color: var(--accent); color: var(--accent); }
    .tog:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Hints ──────────────────────────────────── */
    .hints { font-size: 10px; color: var(--dim); line-height: 2; }

    /* ── Log ────────────────────────────────────── */
    #log-entries { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
    .log-entry { font-family: monospace; font-size: 10px; line-height: 1.5; word-break: break-all; color: var(--dim); }
    .log-entry.cmd  { color: var(--accent); }
    .log-entry.ok   { color: var(--ok); }
    .log-entry.err  { color: var(--err); }
  </style>
</head>
<body>

<div id="topbar">
  <div class="logo">Crane Cam</div>
  <div class="spacer"></div>
  <div class="pill">
    <div class="dot" id="dot-stream"></div>
    <span class="lbl">STREAM</span>
    <span id="lbl-stream" style="font-size:11px;font-family:monospace">—</span>
  </div>
  <div class="pill">
    <div class="dot" id="dot-ptz"></div>
    <span class="lbl">PTZ</span>
    <span id="lbl-ptz" style="font-size:11px;font-family:monospace">—</span>
  </div>
  <div class="pill" style="font-size:10px;color:var(--dim)">
    LAT&nbsp;<span id="lat-ms">—</span><span style="font-size:9px">ms</span>
  </div>
  <button id="sidebar-toggle">☰</button>
</div>

<div id="main">

  <div id="video-panel">
    <video id="stream" autoplay playsinline muted></video>
    <div id="overlay">
      <div class="spinner"></div>
      <p id="overlay-msg">Connecting…</p>
    </div>
  </div>

  <div id="sidebar">
    <div id="tab-bar">
      <button class="tab-btn active" data-tab="conn">CONN</button>
      <button class="tab-btn"        data-tab="cam">CAM</button>
      <button class="tab-btn"        data-tab="log">LOG</button>
    </div>

    <!-- ── CONN tab ── -->
    <div class="tab-pane active" id="tab-conn">
      <div class="sec">Connection</div>
      <div class="field">
        <label>MediaMTX host</label>
        <input type="text" id="cfg-host" value="100.83.7.52">
      </div>
      <div class="field">
        <label>Stream path</label>
        <input type="text" id="cfg-path" value="crane">
      </div>
      <div class="field">
        <label>PTZ server</label>
        <input type="text" id="cfg-ptz" value="localhost:5000">
      </div>
      <button class="btn-main" id="btn-connect">CONNECT</button>

      <div class="sec">Speed</div>
      <div class="sl-row">
        <label>Speed</label>
        <input type="range" id="speed" min="10" max="100" value="50" step="5">
        <span class="sl-val" id="speed-val">50</span>
      </div>

      <div class="sec">Presets</div>
      <button class="btn-preset" data-cmd="preset_home">⌂ Home</button>

      <div class="sec">Controls</div>
      <div class="hints">
        <div>Click video → aim</div>
        <div>Scroll → zoom</div>
        <div>WASD / Arrows → pan/tilt</div>
        <div>+ / − → zoom</div>
        <div>Space → stop &nbsp; H → home</div>
      </div>
    </div>

    <!-- ── CAM tab ── -->
    <div class="tab-pane" id="tab-cam">

      <div class="sec">Colour</div>
      <div class="sl-row">
        <label>Bright</label>
        <input type="range" id="sl-brightness" min="0" max="100" value="50">
        <span class="sl-val" id="v-brightness">50</span>
      </div>
      <div class="sl-row">
        <label>Contrast</label>
        <input type="range" id="sl-contrast" min="0" max="100" value="50">
        <span class="sl-val" id="v-contrast">50</span>
      </div>
      <div class="sl-row">
        <label>Saturation</label>
        <input type="range" id="sl-saturation" min="0" max="100" value="50">
        <span class="sl-val" id="v-saturation">50</span>
      </div>

      <div class="sec">Detail</div>
      <div class="sl-row">
        <label>Sharpness</label>
        <input type="range" id="sl-sharpness" min="0" max="100" value="50">
        <span class="sl-val" id="v-sharpness">50</span>
      </div>
      <div class="sl-row">
        <label>Noise NR</label>
        <input type="range" id="sl-noise" min="0" max="100" value="50">
        <span class="sl-val" id="v-noise">50</span>
      </div>

      <div class="sec">Image</div>
      <div class="field">
        <label>Day / Night</label>
        <select id="sel-daynight">
          <option value="auto">Auto</option>
          <option value="day">Day</option>
          <option value="night">Night</option>
        </select>
      </div>
      <div class="field">
        <label>White Balance</label>
        <select id="sel-wb">
          <option value="auto">Auto</option>
          <option value="sunny">Sunny</option>
          <option value="cloudy">Cloudy</option>
          <option value="fluorescent">Fluorescent</option>
          <option value="tungsten">Tungsten</option>
        </select>
      </div>
      <div class="field">
        <label>Flip / Mirror</label>
        <select id="sel-flip">
          <option value="none">None</option>
          <option value="MIRROR">Mirror (H)</option>
          <option value="FLIP">Flip (V)</option>
          <option value="CENTER">Both</option>
        </select>
      </div>

      <div class="sec">Enhancement</div>
      <div class="tog-row">
        <label>WDR</label>
        <button class="tog" id="tog-wdr">OFF</button>
      </div>
      <div class="sl-row" id="wdr-level-row" style="display:none">
        <label>WDR level</label>
        <input type="range" id="sl-wdr-level" min="0" max="100" value="50">
        <span class="sl-val" id="v-wdr-level">50</span>
      </div>
      <div class="tog-row">
        <label>BLC</label>
        <button class="tog" id="tog-blc">OFF</button>
      </div>
      <div class="tog-row">
        <label>Dehaze</label>
        <button class="tog" id="tog-dehaze">OFF</button>
      </div>
      <div class="sl-row" id="dehaze-level-row" style="display:none">
        <label>Dehaze lvl</label>
        <input type="range" id="sl-dehaze-level" min="0" max="100" value="80">
        <span class="sl-val" id="v-dehaze-level">80</span>
      </div>

      <div class="sec">Focus</div>
      <div class="field">
        <label>Focus mode</label>
        <select id="sel-focus">
          <option value="AUTO">Auto</option>
          <option value="MANUAL">Manual</option>
        </select>
      </div>
      <button class="btn-preset" id="btn-focus-trigger">⟳ Trigger Focus</button>

      <div class="sec" style="margin-top:16px"></div>
      <button class="btn-preset" id="btn-cam-refresh">↻ Refresh from camera</button>
    </div>

    <!-- ── LOG tab ── -->
    <div class="tab-pane" id="tab-log">
      <div id="log-entries"></div>
    </div>

  </div>
</div>

<script>
// ── Config ──────────────────────────────────────
let MEDIAMTX_HOST = "100.83.7.52";
let STREAM_PATH   = "crane";
let PTZ_HOST      = "localhost:5000";

// ── State ────────────────────────────────────────
let pc = null;
let streamActive  = false;
let reconnectTimer = null;

// ── Elements ─────────────────────────────────────
const videoEl    = document.getElementById("stream");
const overlay    = document.getElementById("overlay");
const overlayMsg = document.getElementById("overlay-msg");
const dotStream  = document.getElementById("dot-stream");
const lblStream  = document.getElementById("lbl-stream");
const dotPtz     = document.getElementById("dot-ptz");
const lblPtz     = document.getElementById("lbl-ptz");
const latEl      = document.getElementById("lat-ms");
const speedSlider= document.getElementById("speed");
const logEntries = document.getElementById("log-entries");

// ── Logging ──────────────────────────────────────
function addLog(msg, type = "info") {
  const now = new Date().toLocaleTimeString("en-GB", {hour12: false});
  const el = document.createElement("div");
  el.className = `log-entry ${type}`;
  el.textContent = `${now} ${msg}`;
  logEntries.appendChild(el);
  while (logEntries.children.length > 200) logEntries.removeChild(logEntries.children[0]);
  logEntries.scrollTop = logEntries.scrollHeight;
}

// ── Stream status ─────────────────────────────────
function setStream(state) {
  const m = {
    connecting: ["dot",      "CONNECTING", true,  "Connecting…"],
    live:       ["dot ok",   "LIVE",       false, ""],
    error:      ["dot err",  "ERROR",      true,  "Stream error — retrying…"],
  };
  const [cls, lbl, showOverlay, msg] = m[state] || m.error;
  dotStream.className = cls;
  lblStream.textContent = lbl;
  overlay.style.display = showOverlay ? "flex" : "none";
  if (msg) overlayMsg.textContent = msg;
  streamActive = state === "live";
}

// ── WebRTC ───────────────────────────────────────
async function connect() {
  MEDIAMTX_HOST = document.getElementById("cfg-host").value.trim();
  STREAM_PATH   = document.getElementById("cfg-path").value.trim();
  PTZ_HOST      = document.getElementById("cfg-ptz").value.trim();

  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (pc) { pc.close(); pc = null; }

  setStream("connecting");
  addLog(`Connecting to ${MEDIAMTX_HOST}/${STREAM_PATH}`, "info");

  try {
    pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

    pc.ontrack = (evt) => {
      if (evt.track.kind === "video") videoEl.srcObject = evt.streams[0];
    };

    pc.oniceconnectionstatechange = () => {
      addLog(`ICE: ${pc.iceConnectionState}`, "info");
      if (["connected", "completed"].includes(pc.iceConnectionState)) {
        setStream("live");
        addLog("Stream live", "ok");
        loadCameraSettings();
      } else if (["failed", "disconnected", "closed"].includes(pc.iceConnectionState)) {
        setStream("error");
        scheduleReconnect();
      }
    };

    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const res = await fetch(`http://${MEDIAMTX_HOST}:8889/${STREAM_PATH}/whep`, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: pc.localDescription.sdp
    });
    if (!res.ok) throw new Error(`MediaMTX HTTP ${res.status}`);
    await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
    addLog("SDP exchange complete", "ok");

  } catch (err) {
    setStream("error");
    addLog(`Connection failed: ${err.message}`, "err");
    scheduleReconnect();
  }
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(connect, 4000);
}

// ── PTZ ──────────────────────────────────────────
async function sendPTZ(cmd) {
  try {
    const res = await fetch(`http://${PTZ_HOST}/ptz?cmd=${cmd}&speed=${speedSlider.value}`);
    if (res.ok) {
      dotPtz.className = "dot ok";
      lblPtz.textContent = cmd.replace(/_/g, " ").toUpperCase();
      setTimeout(() => { dotPtz.className = "dot"; lblPtz.textContent = "—"; }, 500);
    }
  } catch (_) {
    dotPtz.className = "dot err";
    setTimeout(() => { dotPtz.className = "dot"; }, 1500);
  }
}

let ptzTimer = null;
function startPTZ(cmd) {
  if (cmd === "stop" || cmd === "preset_home") { sendPTZ(cmd); return; }
  sendPTZ(cmd);
  if (ptzTimer) clearInterval(ptzTimer);
  ptzTimer = setInterval(() => sendPTZ(cmd), 100);
}
function stopPTZ(cmd) {
  if (!ptzTimer) return;
  clearInterval(ptzTimer);
  ptzTimer = null;
  if (cmd !== "stop" && cmd !== "preset_home") sendPTZ("stop");
}

// ── Camera ───────────────────────────────────────
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

async function sendCamera(cmd, value, level = '') {
  try {
    const url = `http://${PTZ_HOST}/camera?cmd=${cmd}&value=${encodeURIComponent(value)}&level=${level}`;
    const res = await fetch(url);
    const ct  = res.headers.get('Content-Type') || '';
    if (ct.includes('xml')) { addLog(`CAM ${cmd} ok`, 'ok'); return; }
    const data = await res.json();
    if (!data.ok) addLog(`CAM ${cmd} err: ${data.error || data.camResponse || ''}`, 'err');
    else addLog(`CAM ${cmd}=${value}`, 'cmd');
  } catch (e) {
    addLog(`CAM ${cmd} failed: ${e.message}`, 'err');
  }
}

function setSlider(slId, vId, value, def) {
  const v = (value !== null && value !== undefined && value !== '') ? parseInt(value) : def;
  const sl = document.getElementById(slId);
  const vl = document.getElementById(vId);
  if (sl) sl.value = v;
  if (vl) vl.textContent = v;
}

function setToggle(id, isOn) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.textContent = isOn ? 'ON' : 'OFF';
  btn.classList.toggle('on', isOn);
}

function updateWdrBlc() {
  const wdrOn = document.getElementById('tog-wdr').classList.contains('on');
  document.getElementById('wdr-level-row').style.display = wdrOn ? 'flex' : 'none';
  const blc = document.getElementById('tog-blc');
  blc.disabled = wdrOn;
}

function updateDehazeLevel() {
  const on = document.getElementById('tog-dehaze').classList.contains('on');
  document.getElementById('dehaze-level-row').style.display = on ? 'flex' : 'none';
}

async function loadCameraSettings() {
  try {
    addLog('Loading camera settings…', 'info');
    const res = await fetch(`http://${PTZ_HOST}/camera?cmd=get_settings`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const xml  = new DOMParser().parseFromString(text, 'application/xml');

    // getElementsByTagName works across XML namespaces; querySelector does not
    function xval(parentTag, childTag) {
      const parent = xml.getElementsByTagName(parentTag)[0];
      if (!parent) return null;
      return parent.getElementsByTagName(childTag)[0]?.textContent ?? null;
    }

    // Colour (Video Input channel)
    setSlider('sl-brightness', 'v-brightness', xval('Color', 'brightnessLevel'), 50);
    setSlider('sl-contrast',   'v-contrast',   xval('Color', 'contrastLevel'),   50);
    setSlider('sl-saturation', 'v-saturation', xval('Color', 'saturationLevel'), 50);

    // Detail (Image channel)
    setSlider('sl-sharpness', 'v-sharpness', xval('Sharpness', 'SharpnessLevel'), 50);
    setSlider('sl-noise',     'v-noise',     xval('GeneralMode', 'generalLevel'),  50);

    // Day/Night
    const dn = xval('IrcutFilter', 'IrcutFilterType');
    if (dn) document.getElementById('sel-daynight').value = dn.toLowerCase();

    // White Balance
    const wb = xval('WhiteBalance', 'WhiteBalanceStyle');
    if (wb) document.getElementById('sel-wb').value = wb.toLowerCase();

    // Flip
    const flipEnabled = xval('ImageFlip', 'enabled');
    const flipStyle   = xval('ImageFlip', 'ImageFlipStyle');
    document.getElementById('sel-flip').value =
      (flipEnabled === 'true' && flipStyle) ? flipStyle : 'none';

    // WDR
    setToggle('tog-wdr', xval('WDR', 'mode') === 'open');
    setSlider('sl-wdr-level', 'v-wdr-level', xval('WDR', 'WDRLevel'), 50);

    // BLC
    setToggle('tog-blc', xval('BLC', 'enabled') === 'true');

    // Dehaze
    setToggle('tog-dehaze', xval('Dehaze', 'DehazeMode') === 'open');
    setSlider('sl-dehaze-level', 'v-dehaze-level', xval('Dehaze', 'DehazeLevel'), 80);

    // Focus
    const focusStyle = xval('FocusConfiguration', 'focusStyle');
    if (focusStyle) document.getElementById('sel-focus').value = focusStyle;

    updateWdrBlc();
    updateDehazeLevel();
    addLog('Camera settings loaded', 'ok');
  } catch (e) {
    addLog(`Settings load failed: ${e.message}`, 'err');
  }
}

// ── Camera control wiring ─────────────────────────

// Simple sliders (debounced 300ms)
[
  ['sl-brightness', 'v-brightness', 'brightness'],
  ['sl-contrast',   'v-contrast',   'contrast'],
  ['sl-saturation', 'v-saturation', 'saturation'],
  ['sl-sharpness',  'v-sharpness',  'sharpness'],
  ['sl-noise',      'v-noise',      'noise'],
].forEach(([slId, vId, cmd]) => {
  const sl   = document.getElementById(slId);
  const vl   = document.getElementById(vId);
  const send = debounce(v => sendCamera(cmd, v), 300);
  sl.addEventListener('input', () => { vl.textContent = sl.value; send(sl.value); });
});

// WDR level slider
const slWdr  = document.getElementById('sl-wdr-level');
const vWdr   = document.getElementById('v-wdr-level');
const dWdr   = debounce(() => {
  const on = document.getElementById('tog-wdr').classList.contains('on');
  sendCamera('wdr', on ? 'open' : 'close', slWdr.value);
}, 300);
slWdr.addEventListener('input', () => { vWdr.textContent = slWdr.value; dWdr(); });

// Dehaze level slider
const slDehaze = document.getElementById('sl-dehaze-level');
const vDehaze  = document.getElementById('v-dehaze-level');
const dDehaze  = debounce(() => {
  const on = document.getElementById('tog-dehaze').classList.contains('on');
  sendCamera('dehaze', on ? 'open' : 'close', slDehaze.value);
}, 300);
slDehaze.addEventListener('input', () => { vDehaze.textContent = slDehaze.value; dDehaze(); });

// Toggle: WDR
document.getElementById('tog-wdr').addEventListener('click', function () {
  const on = !this.classList.contains('on');
  setToggle('tog-wdr', on);
  updateWdrBlc();
  sendCamera('wdr', on ? 'open' : 'close', slWdr.value);
  if (on) {
    setToggle('tog-blc', false);
    sendCamera('blc', 'false');
  }
});

// Toggle: BLC (disabled when WDR is on)
document.getElementById('tog-blc').addEventListener('click', function () {
  if (this.disabled) return;
  const on = !this.classList.contains('on');
  setToggle('tog-blc', on);
  sendCamera('blc', on ? 'true' : 'false');
});

// Toggle: Dehaze
document.getElementById('tog-dehaze').addEventListener('click', function () {
  const on = !this.classList.contains('on');
  setToggle('tog-dehaze', on);
  updateDehazeLevel();
  sendCamera('dehaze', on ? 'open' : 'close', slDehaze.value);
});

// Selects
document.getElementById('sel-daynight').addEventListener('change', function () { sendCamera('daynight', this.value); });
document.getElementById('sel-wb')      .addEventListener('change', function () { sendCamera('wb',       this.value); });
document.getElementById('sel-flip')    .addEventListener('change', function () { sendCamera('flip',     this.value); });
document.getElementById('sel-focus')   .addEventListener('change', function () { sendCamera('focus',    this.value); });

// Buttons
document.getElementById('btn-focus-trigger').addEventListener('click', () => sendCamera('focus_trigger', ''));
document.getElementById('btn-cam-refresh')  .addEventListener('click', loadCameraSettings);

// ── Sidebar / tabs ────────────────────────────────
document.getElementById("sidebar-toggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("collapsed");
});
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-pane").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
  });
});

// ── PTZ buttons / keyboard / scroll / click ───────
document.getElementById("btn-connect").addEventListener("click", connect);
speedSlider.addEventListener("input", () => {
  document.getElementById("speed-val").textContent = speedSlider.value;
});

document.querySelectorAll("[data-cmd]").forEach(btn => {
  const cmd = btn.dataset.cmd;
  btn.addEventListener("mousedown",  () => startPTZ(cmd));
  btn.addEventListener("mouseup",    () => stopPTZ(cmd));
  btn.addEventListener("mouseleave", () => stopPTZ(cmd));
  btn.addEventListener("touchstart", e => { e.preventDefault(); startPTZ(cmd); }, { passive: false });
  btn.addEventListener("touchend",   () => stopPTZ(cmd));
});

const keyMap = {
  ArrowLeft: "pan_left",  ArrowRight: "pan_right",
  ArrowUp:   "tilt_up",   ArrowDown:  "tilt_down",
  KeyW: "tilt_up",   KeyS: "tilt_down",
  KeyA: "pan_left",  KeyD: "pan_right",
  Equal: "zoom_in",  Minus: "zoom_out",
  Space: "stop",     KeyH: "preset_home",
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.repeat) return;
  const cmd = keyMap[e.code];
  if (cmd) { e.preventDefault(); startPTZ(cmd); }
});
document.addEventListener("keyup", e => {
  const cmd = keyMap[e.code];
  if (cmd) stopPTZ(cmd);
});

document.getElementById("video-panel").addEventListener("wheel", e => {
  e.preventDefault();
  sendPTZ(e.deltaY < 0 ? "zoom_in" : "zoom_out");
}, { passive: false });

videoEl.addEventListener("click", async e => {
  if (!streamActive) return;
  const rect = videoEl.getBoundingClientRect();
  const nx = (e.clientX - (rect.left + rect.width  / 2)) / (rect.width  / 2);
  const ny = (e.clientY - (rect.top  + rect.height / 2)) / (rect.height / 2);
  try {
    await fetch(`http://${PTZ_HOST}/ptz/delta?pan=${Math.round(nx*45)}&tilt=${Math.round(ny*45)}`);
    dotPtz.className = "dot ok";
    lblPtz.textContent = "AIM";
    setTimeout(() => { dotPtz.className = "dot"; lblPtz.textContent = "—"; }, 500);
  } catch (_) {}
});

// ── Live edge (keeps stream latency low) ──────────
const TARGET_LAT = 0.15, MAX_LAT = 0.5;
setInterval(() => {
  if (!streamActive || videoEl.readyState < 2 || !videoEl.buffered.length) return;
  try {
    const edge   = videoEl.buffered.end(videoEl.buffered.length - 1);
    const behind = edge - videoEl.currentTime;
    const ms = Math.round(behind * 1000);
    if (ms >= 0) {
      latEl.textContent = ms;
      latEl.style.color = ms < 300 ? "var(--ok)" : ms < 600 ? "var(--warn)" : "var(--err)";
    }
    if (behind > MAX_LAT) videoEl.currentTime = edge - TARGET_LAT;
  } catch (_) {}
}, 200);

// ── Start ─────────────────────────────────────────
addLog("Operator interface loaded", "ok");
connect();
</script>
</body>
</html>
